[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivion"
version = "0.1.0"
description = "Drivion - a personal, voice-controlled AI desktop assistant for Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
# Milestone 1 dependencies only. Later milestones add audio, vision and AI
# packages as they are implemented and verified.
dependencies = [
    "PySide6>=6.8,<6.10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
drivion = "drivion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
