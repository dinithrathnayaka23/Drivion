[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drivion"
version = "0.1.0"
description = "Drivion - a personal, voice-controlled AI desktop assistant for Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
# Milestone 1 dependencies only. Later milestones add audio, vision and AI
# packages as they are implemented and verified.
dependencies = [
    "PySide6>=6.8,<6.10",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
    # Milestone 4: microphone capture and wake word.
    "numpy>=1.26,<3",
    "sounddevice>=0.4.6,<0.6",
    # Pinned exactly: 0.6.0 is the last release and we rely on its Model API.
    "openwakeword==0.6.0",
    "onnxruntime>=1.17,<2",
    # Milestone 5: speech recognition and spoken replies.
    # Pinned exactly: Drivion uses its bundled Silero VAD wrapper (faster_whisper.vad).
    "faster-whisper==1.2.1",
    "comtypes>=1.4,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-qt>=4.4,<5",
]

[project.scripts]
drivion = "drivion.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
qt_api = "pyside6"
