# Drivion configuration (non-secret settings only).
#
# Copy this file to config/settings.toml (git-ignored) and edit it.
# Every key is optional: anything you leave out uses the built-in default.
# Unknown keys or out-of-range values are rejected at startup with a clear error.
# API keys do NOT go here - put them in .env (see .env.example).

[general]
log_level = "INFO"          # DEBUG, INFO, WARNING, ERROR

[ui]
animations = true           # false = static indicator (reduced motion, lower CPU)
history_limit = 50          # 10..500 commands kept in memory for this session

[wake_word]
enabled = true
engine = "openwakeword"
model = "hey_jarvis"        # built-in model, or a path to your own .onnx (see docs/WAKE_WORD.md)
# phrase = "Wake up, Drivion" # text shown in the dashboard for a custom model
sensitivity = 0.5           # 0.0 (fewer false wakes) .. 1.0 (fewer missed wakes)
cooldown_s = 2.0            # ignore repeat detections for this many seconds
# input_device = "Microphone Array"  # index or part of the name; see `drivion --list-audio-devices`

[face]
similarity_threshold = 0.6  # 0.0..1.0, calibrated during the face milestone
store_raw_images = false    # keep enrollment photos? false = templates only
liveness_mode = "challenge" # "none", "blink" or "challenge"
verification_timeout_s = 10.0  # 1..60; no result in time = access denied

[voice]
stt_model = "base.en"       # faster-whisper model name
tts_engine = "windows"      # "windows" or "piper"
command_timeout_s = 8.0     # seconds of silence before a command is abandoned

[llm]
provider = "none"           # "none", "openai" or "anthropic"
model = ""
request_timeout_s = 20.0
